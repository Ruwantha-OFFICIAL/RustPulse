name: Rust Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross compiler for Linux ARM64
      - name: Setup Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          # Determine source binary extension based on target
          BINARY_NAME="rustpulse"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          OUTPUT_NAME="rustpulse-${{ matrix.name }}"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          # Copy the binary with proper naming
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" \
             "dist/${OUTPUT_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustpulse-${{ matrix.name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rustpulse-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            # RustPulse Installation Guide
            
            **1.** Download the binary for your platform below.
            **2.** Give it execution permissions and run it.

            ## Linux
            ```bash
            chmod +x rustpulse-linux-amd64
            ./rustpulse-linux-amd64 -url https://google.com/ -count 50
            ```

            ## Windows
            ```powershell
            .\rustpulse-windows-amd64.exe -url https://google.com/ -count 50
            ```
            
            ## Other Setups
            For macOS, Android (Termux), or manual source builds, please clone the repository and build using Cargo.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
